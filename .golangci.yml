version: "2"

linters:
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    staticcheck:
      checks:
        - all
        # golangci-lint default exclusions
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # examples use dot imports to keep combinator DSL readable
        - -ST1001

formatters:
  enable:
    - gofmt
