version: "2"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - misspell
    - unconvert
    - copyloopvar
    - errname
    - errorlint
    - exptostd
    - gocritic
    - godot
    - intrange
    - modernize
    - nolintlint
    - nonamedreturns
    - predeclared
    - recvcheck
    - testifylint
    - unparam
    - usetesting
    - wastedassign
    - whitespace
  settings:
    staticcheck:
      checks:
        - all
        # golangci-lint default exclusions
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # examples use dot imports to keep combinator DSL readable
        - -ST1001

formatters:
  enable:
    - gofumpt
